name: Build MangaOCR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications/ | grep Xcode

      - name: Select Xcode
        run: |
          # Use latest available Xcode
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Build archive
        run: |
          xcodebuild archive \
            -project MangaOCR.xcodeproj \
            -scheme MangaOCR \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MangaOCR.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="RELEASE"

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/MangaOCR.xcarchive/Products/Applications/MangaOCR.app build/Payload/
          cd build
          zip -r MangaOCR.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaOCR-IPA
          path: build/MangaOCR.ipa
