name: Build MangaOCR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "## XcodeGen" >> $GITHUB_STEP_SUMMARY
          echo "Project generated successfully." >> $GITHUB_STEP_SUMMARY
          xcodebuild -list -project MangaOCR.xcodeproj >> $GITHUB_STEP_SUMMARY 2>&1

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project MangaOCR.xcodeproj \
            -scheme MangaOCR \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build_log.txt
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "Build succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: Dump errors on failure
        if: failure()
        run: |
          echo "## Build Errors" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -iE "error:" build_log.txt 2>/dev/null | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "## Last 80 lines" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -80 build_log.txt 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "No build log found" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "MangaOCR.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r MangaOCR.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaOCR-IPA
          path: MangaOCR.ipa
