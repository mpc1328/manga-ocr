name: Build MangaOCR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build archive
        run: |
          xcodebuild archive \
            -project MangaOCR.xcodeproj \
            -scheme MangaOCR \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/MangaOCR.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -r build/MangaOCR.xcarchive/Products/Applications/MangaOCR.app build/Payload/
          cd build
          zip -r MangaOCR.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaOCR-IPA
          path: build/MangaOCR.ipa
