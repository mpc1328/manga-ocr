name: Build MangaOCR IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          echo "=== Schemes ==="
          xcodebuild -list -project MangaOCR.xcodeproj

      - name: Build app
        run: |
          mkdir -p build
          xcodebuild build \
            -project MangaOCR.xcodeproj \
            -scheme MangaOCR \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            > build/build_log.txt 2>&1; BUILD_EXIT=$?
          echo "::group::Build errors"
          grep -iE "error:|fatal|failed" build/build_log.txt || echo "No error lines"
          echo "::endgroup::"
          echo "::group::Last 80 lines"
          tail -80 build/build_log.txt
          echo "::endgroup::"
          exit $BUILD_EXIT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build_log.txt
          if-no-files-found: ignore

      - name: Show last 100 lines of build log on failure
        if: failure()
        run: |
          echo "=== LAST 100 LINES OF BUILD LOG ==="
          tail -100 build/build_log.txt || echo "No build log found"

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "MangaOCR.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MangaOCR.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MangaOCR-IPA
          path: build/MangaOCR.ipa
