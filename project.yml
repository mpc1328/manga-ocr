name: MangaOCR
options:
  bundleIdPrefix: com.mangaocr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MangaOCR:
    type: application
    platform: iOS
    sources:
      - path: MangaOCR
        excludes:
          - Info.plist
    settings:
      base:
        INFOPLIST_FILE: MangaOCR/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mangaocr.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
      debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      release:
        SWIFT_COMPILATION_MODE: wholemodule

schemes:
  MangaOCR:
    build:
      targets:
        MangaOCR: all
